# controller_manager parameter-server description of AdhereKamrController, for reference and
# for any future spawner-based launch path. adhere_mujoco_node.cpp currently loads this
# controller programmatically (ControllerManager::load_controller(name, type), bypassing the
# need to read "type" from the parameter server), so this file is not passed as a launch
# parameter today -- it documents the exact plugin type/name contract that the programmatic
# path also uses, and is the file a future `ros2 run controller_manager spawner` invocation
# would consume via --param-file.
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz, matches AdhereMujocoHardware's 500Hz physics tick exactly.

    adhere_kamr_controller:
      type: adhere_kamr_controller/AdhereKamrController
