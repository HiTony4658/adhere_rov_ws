# adhere_mujoco_node runtime parameters (actually loaded) + wave-profile numeric reference
# (documentation only -- the authoritative numbers live in flow_environment_plugin.cpp's
# CalmWaterPlugin/StationKeepingGustPlugin, kept bit-for-bit identical to
# mujoco_mppi_ws/src/env/hydrodynamics.py so this file never silently drifts out of sync).

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz, matches AdhereMujocoHardware's 500Hz physics tick (dt=2.0ms)

# ---------------------------------------------------------------------------------------
# Reference only, not parsed at runtime. Select the active profile via the `wave_profile`
# hardware param (xacro/ros2_control.xacro) or the `wave_profile` launch argument of
# mujoco_sim.launch.py.
# ---------------------------------------------------------------------------------------
wave_profiles:
  calm:
    current_steady_world: [0.0, 0.0, 0.0]
    gust_events: []

  station_keeping_gust:
    current_steady_world: [0.0, 0.3, 0.0]
    gust_events:
      - {t_start: 3.0, t_end: 4.2, peak_y: 0.9, peak_x: 0.2}
      - {t_start: 7.0, t_end: 8.2, peak_y: 0.9, peak_x: 0.2}

  # common HydroParams fields shared by every profile above (calm-water defaults)
  common:
    rho_water: 1000.0
    gravity: 9.81
    vehicle_mass: 20.0
    augmented_mass: 26.0
    displaced_volume: 0.0202
    cob_offset_body: [0.0, 0.0, 0.05]
    z_surface: 1.0
    z_transition: 0.4
    D_lin: [30.0, 20.0, 25.0]
    D_quad: [140.0, 50.0, 70.0]
    D_ang_lin: [8.0, 8.0, 10.0]
    D_ang_quad: [15.0, 15.0, 20.0]
    C_venturi: 0.45
    h_gap_nominal: 0.025
    A_plate: 0.24
    h0_decay: 0.05
    wall_x_offset: 0.1
