# xbox_teleop_node parameters (CLAUDE.md Phase 3.2 Stage 2.3): Mode-2 (美国手) stick/button
# mapping. Axis indices match the Linux xpad driver's default 8-axis Xbox-360-style layout
# ([LX, LY, LT, RX, RY, RT, DX, DY]); adjust axis_*/button_* here if a different pad or driver
# reports a different index order (run `ros2 topic echo /joy` to find the right indices).
xbox_teleop_node:
  ros__parameters:
    deadzone: 0.08
    cubic_curve: true

    axis_heave: 1   # Left stick vertical (LY):  up(+)   -> heave_z > 0 (ascend +Z)
    axis_yaw: 0     # Left stick horizontal (LX): left(+) -> yaw_rate > 0 (+omega_z, CCW)
    axis_surge: 4   # Right stick vertical (RY):  up(+)   -> surge_x > 0 (toward the wall, -X body)
    axis_sway: 3    # Right stick horizontal (RX): right/left -> sway_y
    axis_pitch_trigger: 2  # LT (Phase 3.5): pressed -> pitch_rate > 0 (+omega_y); LB reverses sign
    axis_roll_trigger: 5   # RT (Phase 3.5): pressed -> roll_rate > 0 (+omega_x); RB reverses sign

    button_passive: 0     # A -> IDLE_PASSIVE_NONE (instant safety zero-thrust)
    button_pid_hold: 1    # B -> HOLD_PID_6DOF
    button_open_loop: 3   # Y -> TELEOP_OPENLOOP_6DOF
    button_pitch_reverse: 4  # LB (Phase 3.5): held while pressing LT -> pitch_rate < 0
    button_roll_reverse: 5   # RB (Phase 3.5): held while pressing RT -> roll_rate < 0
